<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DND 角色卡 A4 打印原型</title>
  <style>
    :root {
      --paper-w: 210mm;
      --paper-h: 297mm;
      --ink: #202124;
      --muted: #667085;
      --line: rgba(20, 96, 160, 0.5);
      --fill: rgba(33, 150, 243, 0.08);
      --panel: #ffffff;
      --page-shadow: 0 16px 38px rgba(15, 23, 42, 0.16);
      --toolbar-h: 74px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", Arial, sans-serif;
      color: var(--ink);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      background: #f3f6f8;
      color: var(--ink);
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 20;
      min-height: var(--toolbar-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 22px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid #e6ebf0;
      box-shadow: 0 4px 18px rgba(15, 23, 42, 0.06);
    }

    .toolbar h1 {
      margin: 0 0 3px 0;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .toolbar p {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button, .file-picker {
      appearance: none;
      border: 1px solid #cad5df;
      background: #fff;
      color: #1f2937;
      border-radius: 9px;
      padding: 9px 13px;
      font-size: 13px;
      line-height: 1;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
    }

    .file-picker input { display: none; }

    button.primary {
      border-color: #1f6feb;
      background: #1f6feb;
      color: #fff;
      font-weight: 650;
    }

    button:active, .file-picker:active { transform: translateY(1px); }

    .workspace {
      padding: 28px 18px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
    }

    .page-shell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .page-label {
      color: #475467;
      font-size: 12px;
      letter-spacing: 0.08em;
    }

    .sheet {
      position: relative;
      width: var(--paper-w);
      height: var(--paper-h);
      background: var(--panel);
      overflow: hidden;
      box-shadow: var(--page-shadow);
      page-break-after: always;
      break-after: page;
    }

    .sheet:last-of-type { page-break-after: auto; break-after: auto; }

    .sheet-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: fill;
      user-select: none;
      pointer-events: none;
    }

    .slot {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #155eef;
      font-size: 10px;
      line-height: 1.15;
      font-weight: 600;
      border: 1px dashed var(--line);
      background: var(--fill);
      border-radius: 3px;
      overflow: hidden;
      padding: 1mm;
      white-space: pre-line;
    }

    .slot.small { font-size: 10px; }
    .slot.long { justify-content: center; text-align: center; padding-left: 1mm; padding-right: 1mm; }
    .slot.block { align-items: center; justify-content: center; text-align: center; padding: 2mm; }
    .slot.round { border-radius: 999px; }
    .slot.main-name { font-size: 12.5px; font-weight: 700; }
    .slot.header-field { font-size: 12px; font-weight: 650; }
    .slot.ability-score { font-size: 18px; font-weight: 800; padding-top: 6.8mm; align-items: center; }
    .slot.stat-value { font-size: 14px; font-weight: 800; }
    .slot.prof-value { font-size: 12px; font-weight: 800; }
    .slot.save-score { font-size: 10px; font-weight: 700; padding: 0; }
    .slot.hp-max { font-size: 12px; font-weight: 700; align-items: center; justify-content: center; padding-left: 1mm; padding-right: 1mm; }
    .slot.skill-score { font-size: 10px; font-weight: 700; padding: 0; }
    .slot.weapon-cell { font-size: 12px; font-weight: 650; padding: 0.5mm; }
    .slot.weapon-name { justify-content: center; text-align: center; padding-left: 0.5mm; padding-right: 0.5mm; }
    .slot.gp-value { font-size: 10px; font-weight: 750; padding: 0.5mm; }
    .slot.equipment-value { align-items: flex-start; justify-content: flex-start; text-align: left; font-size: 12px; line-height: 1.2; font-weight: 500; padding: 1.4mm; }
    .slot.other-proficiency-value { align-items: flex-start; justify-content: flex-start; text-align: left; font-size: 12px; line-height: 1.25; font-weight: 500; padding: 1.4mm; }
    .slot.features-value { align-items: flex-start; justify-content: flex-start; text-align: left; font-size: 12px; line-height: 1.2; font-weight: 500; padding: 2mm; }
    .slot.spell-header-value { font-size: 14px; font-weight: 800; }
    .spell-section {
      position: absolute;
      border: 1px dashed var(--line);
      background: rgba(33, 150, 243, 0.04);
      border-radius: 3px;
      overflow: hidden;
      color: #155eef;
    }
    .spell-slot-count {
      position: absolute;
      left: 16%;
      top: 2.1%;
      width: 10%;
      height: 9.2%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px dashed var(--line);
      background: var(--fill);
      border-radius: 3px;
      font-size: 12px;
      font-weight: 800;
      color: #155eef;
    }
    .spell-slot-count::before { content: attr(data-field); opacity: 0.78; }
    .spell-slot-count.has-value::before { display: none; }
    .spell-list {
      position: absolute;
      left: 4.5%;
      right: 4.5%;
      top: 5.5%;
      bottom: 3.5%;
      display: flex;
      flex-direction: column;
      gap: 0.35mm;
    }
    .spell-section.has-slot .spell-list { top: 14%; }
    .spell-row {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      text-align: left;
      border: 1px dashed rgba(20, 96, 160, 0.32);
      background: rgba(33, 150, 243, 0.035);
      border-radius: 2px;
      color: #155eef;
      font-size: 10px;
      line-height: 1.08;
      font-weight: 560;
      padding: 0 0.8mm;
      overflow: hidden;
      white-space: pre-wrap;
    }
    .spell-row::before { content: attr(data-field); opacity: 0.72; }
    .spell-row.has-value { color: #111827; background: rgba(255, 255, 255, 0.08); border-color: rgba(20, 96, 160, 0.22); }
    .spell-row.has-value::before { display: none; }
    .editable-field {
      cursor: text;
      white-space: pre-wrap;
      -webkit-user-modify: read-write-plaintext-only;
    }
    .spell-row.editable-field { white-space: nowrap; }
    .editable-field:focus {
      outline: 1.5px solid rgba(31, 111, 235, 0.55);
      outline-offset: -1px;
      background: rgba(255, 255, 255, 0.55);
    }
    .editable-field:focus::before { display: none; }

    .slot::before {
      content: attr(data-field);
      opacity: 0.78;
      white-space: normal;
    }

    .slot.has-value {
      color: #111827;
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(20, 96, 160, 0.35);
    }

    .slot.has-value::before { display: none; }

    .prof-dot {
      position: absolute;
      display: block;
      border: 1px dashed var(--line);
      background: var(--fill);
      border-radius: 999px;
      padding: 0;
    }

    .prof-dot.filled-dot {
      border-color: #111827;
      background: #111827;
    }

    body.hide-helpers .slot,
    body.hide-helpers .prof-dot,
    body.hide-helpers .spell-section,
    body.hide-helpers .spell-row,
    body.hide-helpers .spell-slot-count {
      border-color: transparent;
      background: transparent;
    }

    body.hide-helpers .slot:not(.has-value)::before,
    body.hide-helpers .spell-row:not(.has-value)::before,
    body.hide-helpers .spell-slot-count:not(.has-value)::before { color: transparent; }
    body.hide-helpers .slot.has-value,
    body.hide-helpers .spell-row.has-value,
    body.hide-helpers .spell-slot-count.has-value { color: #111827; }
    body.hide-helpers .prof-dot.filled-dot { background: #111827; border-color: #111827; }

    .screen-note {
      max-width: 210mm;
      margin: 0 auto 4px;
      color: #475467;
      font-size: 12px;
      line-height: 1.55;
    }

    .status {
      min-width: 160px;
      color: #475467;
      font-size: 12px;
      text-align: right;
    }

    @page {
      size: A4 portrait;
      margin: 0;
    }

    @media print {
      html, body {
        width: 210mm;
        margin: 0;
        padding: 0;
        background: #fff;
      }

      .toolbar, .page-label, .screen-note {
        display: none !important;
      }

      .workspace {
        display: block;
        padding: 0;
        margin: 0;
      }

      .page-shell {
        display: block;
        margin: 0;
        padding: 0;
      }

      .sheet {
        width: 210mm;
        height: 297mm;
        margin: 0;
        padding: 0;
        box-shadow: none;
        overflow: hidden;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }

      .slot,
      .spell-section,
      .spell-row,
      .spell-slot-count {
        border-color: transparent !important;
        background: transparent !important;
        color: transparent !important;
      }

      .slot:not(.has-value)::before,
      .spell-row:not(.has-value)::before,
      .spell-slot-count:not(.has-value)::before { display: none !important; }
      .slot.has-value,
      .spell-row.has-value,
      .spell-slot-count.has-value { color: #111827 !important; }

      .prof-dot {
        border-color: transparent !important;
        background: transparent !important;
      }

      .prof-dot.filled-dot {
        border-color: #111827 !important;
        background: #111827 !important;
      }
    }
  </style>
</head>

  <header class="toolbar">
    <div>
      <h1>DND 角色卡 A4 打印原型 v2</h1>
      <p>v2：支持导入角色 JSON 自动填充，也支持导出当前编辑状态 JSON，下次可继续导入编辑。</p>
    </div>
    <div class="actions">
      <label class="file-picker">导入 JSON<input id="jsonUpload" type="file" accept=".json,application/json" /></label>
      <button type="button" id="exportJson">导出 JSON</button>
      <button type="button" id="clearData">清空填充</button>
      <button type="button" id="toggleHelpers">隐藏定位层</button>
      <button type="button" class="primary" onclick="window.print()">打印</button>
      <span class="status" id="statusText">尚未载入 JSON</span>
    </div>
  </header>

  <script>
    const toggle = document.getElementById("toggleHelpers");
    const upload = document.getElementById("jsonUpload");
    const exportJsonButton = document.getElementById("exportJson");
    const clearDataButton = document.getElementById("clearData");
    const statusText = document.getElementById("statusText");

    const abilityKeys = ["str", "dex", "con", "int", "wis", "cha"];
    const skillNames = ["运动", "特技", "巧手", "隐匿", "调查", "奥秘", "历史", "自然", "宗教", "察觉", "洞悉", "驯兽", "医药", "求生", "游说", "欺瞒", "威吓", "表演"];

    buildSpellRows();
    enableInlineEditing();
    ensureStateKeys();

    toggle.addEventListener("click", () => {
      document.body.classList.toggle("hide-helpers");
      toggle.textContent = document.body.classList.contains("hide-helpers") ? "显示定位层" : "隐藏定位层";
    });

    clearDataButton.addEventListener("click", () => {
      clearFilledData();
      statusText.textContent = "已清空填充";
    });

    exportJsonButton.addEventListener("click", () => {
      exportCurrentState();
    });

    upload.addEventListener("change", async (event) => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        if (isOverlayBackup(data)) {
          applyOverlayBackup(data);
          statusText.textContent = `已恢复备份：${file.name}`;
        } else {
          renderCharacter(data);
          statusText.textContent = `已导入角色：${file.name}`;
        }
      } catch (error) {
        console.error(error);
        statusText.textContent = "JSON 解析失败";
        alert("JSON 解析失败：请确认上传的是有效的角色 JSON 文件。");
      }
    });

    function pick(source, paths, fallback = "") {
      for (const path of paths) {
        const value = path.split(".").reduce((acc, key) => {
          if (acc === undefined || acc === null) return undefined;
          return acc[key];
        }, source);
        if (value !== undefined && value !== null && value !== "") return value;
      }
      return fallback;
    }

    function compactJoin(parts, separator = "-") {
      return parts.filter((item) => item !== undefined && item !== null && item !== "").join(separator);
    }

    function formatBonus(value) {
      if (value === undefined || value === null || value === "") return "";
      const num = Number(value);
      if (Number.isNaN(num)) return String(value);
      return num > 0 ? `+${num}` : String(num);
    }

    function setSlot(selector, value) {
      const element = document.querySelector(selector);
      if (!element) return;
      const text = value === undefined || value === null ? "" : String(value);
      element.textContent = text;
      element.classList.toggle("has-value", text.trim() !== "");
    }

    function clearFilledData() {
      document.querySelectorAll(".has-value").forEach((element) => {
        element.textContent = "";
        element.classList.remove("has-value");
      });
      document.querySelectorAll(".prof-dot.filled-dot").forEach((element) => {
        element.classList.remove("filled-dot");
      });
    }

    function getEditableFields() {
      return Array.from(document.querySelectorAll(".slot, .spell-row, .spell-slot-count"));
    }

    function getStateDots() {
      return Array.from(document.querySelectorAll(".prof-dot"));
    }

    function ensureStateKeys() {
      getEditableFields().forEach((element, index) => {
        if (!element.dataset.stateKey) element.dataset.stateKey = `field-${index}`;
      });
      getStateDots().forEach((element, index) => {
        if (!element.dataset.stateKey) element.dataset.stateKey = `dot-${index}`;
      });
    }

    function isOverlayBackup(data) {
      return data && data.schema === "dnd-character-sheet-overlay/v1" && Array.isArray(data.fields);
    }

    function collectOverlayState() {
      ensureStateKeys();
      return {
        schema: "dnd-character-sheet-overlay/v1",
        template: "dnd-character-a4-prototype-v2",
        exportedAt: new Date().toISOString(),
        fields: getEditableFields().map((element) => ({
          key: element.dataset.stateKey,
          text: element.textContent,
          hasValue: element.classList.contains("has-value") || element.textContent.trim() !== ""
        })),
        dots: getStateDots().map((element) => ({
          key: element.dataset.stateKey,
          filled: element.classList.contains("filled-dot")
        }))
      };
    }

    function exportCurrentState() {
      const state = collectOverlayState();
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
      const link = document.createElement("a");
      const timestamp = new Date().toISOString().replace(/[:.]/g, "-");
      link.href = URL.createObjectURL(blob);
      link.download = `dnd-character-sheet-backup-${timestamp}.json`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(link.href);
      statusText.textContent = "已导出当前编辑 JSON";
    }

    function applyOverlayBackup(data) {
      clearFilledData();
      ensureStateKeys();
      const fieldMap = new Map(data.fields.map((item) => [item.key, item]));
      getEditableFields().forEach((element) => {
        const item = fieldMap.get(element.dataset.stateKey);
        if (!item) return;
        element.textContent = item.text || "";
        element.classList.toggle("has-value", Boolean(item.hasValue) || element.textContent.trim() !== "");
      });
      const dotMap = new Map((data.dots || []).map((item) => [item.key, item]));
      getStateDots().forEach((element) => {
        const item = dotMap.get(element.dataset.stateKey);
        element.classList.toggle("filled-dot", Boolean(item && item.filled));
      });
    }

    function syncEditableState(element) {
      element.classList.toggle("has-value", element.textContent.trim() !== "");
    }

    function insertPlainTextAtCursor(text) {
      const selection = window.getSelection();
      if (!selection || selection.rangeCount === 0) return;
      const range = selection.getRangeAt(0);
      range.deleteContents();
      const textNode = document.createTextNode(text);
      range.insertNode(textNode);
      range.setStartAfter(textNode);
      range.collapse(true);
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function enableInlineEditing(root = document) {
      root.querySelectorAll(".slot, .spell-row, .spell-slot-count").forEach((element) => {
        if (element.dataset.editableReady === "true") return;
        element.dataset.editableReady = "true";
        element.setAttribute("contenteditable", "plaintext-only");
        element.setAttribute("spellcheck", "false");
        element.classList.add("editable-field");
        element.addEventListener("keydown", (event) => {
          if (event.key !== "Enter" || event.isComposing) return;
          event.preventDefault();
          insertPlainTextAtCursor("\n");
          syncEditableState(element);
        });
        element.addEventListener("input", () => syncEditableState(element));
        element.addEventListener("blur", () => syncEditableState(element));
        element.addEventListener("paste", (event) => {
          event.preventDefault();
          const text = (event.clipboardData || window.clipboardData).getData("text/plain");
          insertPlainTextAtCursor(text);
          syncEditableState(element);
        });
      });
    }

    function formatClasses(data) {
      const classes = pick(data, ["classes", "exports.embedded_json.classes"], []);
      if (!Array.isArray(classes)) return "";
      return classes
        .filter((item) => item && item.name)
        .map((item) => {
          const career = compactJoin([item.name, item.subclass || item.sub], "-");
          const level = item.level !== undefined && item.level !== null && item.level !== "" ? `Lv.${item.level}` : "";
          return compactJoin([career, level], " ");
        })
        .join(" / ");
    }

    function formatSpellClass(data) {
      const ability = pick(data, ["spellcasting.spellcasting_ability", "spellcasting_ability"]);
      if (!ability) return "";
      const classes = pick(data, ["classes", "exports.embedded_json.classes"], []);
      if (!Array.isArray(classes)) return "";
      return classes
        .filter((item) => item && item.name)
        .map((item) => item.name)
        .join(" / ");
    }

    function formatRace(data) {
      const race = pick(data, ["identity.race", "race"], null);
      if (race && typeof race === "object") return compactJoin([race.name, race.subrace], "-");
      if (race) return String(race);
      const raceName = pick(data, ["exports.embedded_json.identity.race", "identity.race.name", "race.name"], "");
      const subrace = pick(data, ["exports.embedded_json.identity.subrace", "identity.race.subrace", "race.subrace"], "");
      return compactJoin([raceName, subrace], "-");
    }

    function formatWeaponDamage(weapon) {
      if (!weapon) return "";
      const damage = weapon.damage || "";
      const type = weapon.damage_type || weapon.dmg_type || "";
      return compactJoin([damage, type], " ");
    }

    function shouldSkipFeatureInMain(feature) {
      const name = feature && feature.name ? String(feature.name) : "";
      return ["属性值加成", "武器", "语言"].some((keyword) => name.includes(keyword));
    }

    function getAllFeatures(data) {
      const classFeatures = pick(data, ["features.class_features"], []);
      const raceFeatures = pick(data, ["features.race_features"], []);
      const all = [];
      if (Array.isArray(classFeatures)) all.push(...classFeatures);
      if (Array.isArray(raceFeatures)) all.push(...raceFeatures);
      return all;
    }

    function formatFeatures(data) {
      const classFeatures = pick(data, ["features.class_features"], []);
      const raceFeatures = pick(data, ["features.race_features"], []);
      const lines = [];

      if (Array.isArray(classFeatures) && classFeatures.length) {
        const visibleClassFeatures = classFeatures.filter((feature) => Number(feature && feature.level) !== 1 && !shouldSkipFeatureInMain(feature));
        if (visibleClassFeatures.length) {
          lines.push("【职业特性】");
          visibleClassFeatures.forEach((feature) => {
            if (!feature || !feature.name) return;
            const level = feature.level ? `Lv.${feature.level} ` : "";
            const description = feature.description ? String(feature.description).replace(/\n+/g, " ") : "";
            lines.push(`${level}${feature.name}：${description}`);
          });
        }
      }

      if (Array.isArray(raceFeatures) && raceFeatures.length) {
        const visibleRaceFeatures = raceFeatures.filter((feature) => !shouldSkipFeatureInMain(feature));
        if (visibleRaceFeatures.length) {
          lines.push("【种族特性】");
          visibleRaceFeatures.forEach((feature) => {
            if (!feature || !feature.name) return;
            const description = feature.description ? String(feature.description).replace(/\n+/g, " ") : "";
            lines.push(`${feature.name}：${description}`);
          });
        }
      }

      return lines.join("\n");
    }

    function formatOtherProficiencies(data) {
      const languages = pick(data, ["identity.languages", "languages"], []);
      const tools = pick(data, ["identity.tool_proficiencies", "tool_proficiencies"], []);
      const weaponDescriptions = getAllFeatures(data)
        .filter((feature) => feature && feature.description && String(feature.description).includes("武器熟练"))
        .map((feature) => String(feature.description).replace(/\n+/g, " ").trim())
        .filter(Boolean);

      const lines = [];
      lines.push(`语言：${Array.isArray(languages) ? languages.join(",") : languages || ""}`);
      const toolText = Array.isArray(tools) ? (tools.length ? tools.join(",") : "无") : (tools || "无");
      lines.push(`工具：${toolText}`);
      if (weaponDescriptions.length) lines.push(`武器：${weaponDescriptions.join("；")}`);
      return lines.join("\n");
    }

    function formatPersonality(data) {
      const personality = pick(data, ["background.personality", "personality"]);
      const traits = pick(data, ["background.traits", "traits"]);
      return [personality, traits]
        .filter((item) => item !== undefined && item !== null && String(item).trim() !== "")
        .join("\n");
    }

    function buildSpellRows() {
      document.querySelectorAll("[data-spell-section]").forEach((section) => {
        if (section.querySelector(".spell-list")) return;
        const level = section.getAttribute("data-spell-section");
        const rows = Number(section.getAttribute("data-rows") || 0);
        if (level !== "0") section.classList.add("has-slot");
        const list = document.createElement("div");
        list.className = "spell-list";
        for (let index = 0; index < rows; index += 1) {
          const row = document.createElement("div");
          row.className = "spell-row";
          if (level === "0") {
            row.dataset.cantripIndex = String(index);
            row.dataset.field = `戏法${index + 1}`;
          } else {
            row.dataset.spellLevel = level;
            row.dataset.spellIndex = String(index);
            row.dataset.field = `${level}环法术${index + 1}`;
          }
          list.appendChild(row);
        }
        section.appendChild(list);
      });
    }

    function formatSpell(spell) {
      if (!spell || !spell.name) return "";
      const meta = spell.meta || {};
      const details = [meta.components, meta.range, meta.casting_time, meta.school]
        .filter((item) => item !== undefined && item !== null && item !== "")
        .join("，");
      return details ? `${spell.name}(${details})` : spell.name;
    }

    function renderSpellSlots(data) {
      const slots = pick(data, ["spellcasting.spell_slots", "spell_slots", "exports.embedded_json.spell_slots"], {});
      document.querySelectorAll("[data-spell-slot]").forEach((element) => {
        const level = element.getAttribute("data-spell-slot");
        const slot = slots && slots[level];
        const value = slot && slot.max !== undefined && slot.max !== null && slot.max !== 0 ? slot.max : "";
        element.textContent = value;
        element.classList.toggle("has-value", value !== "");
      });
    }

    const spellMeasureCanvas = document.createElement("canvas");
    const spellMeasureContext = spellMeasureCanvas.getContext("2d");

    function getRowTextWidth(row, text) {
      const style = window.getComputedStyle(row);
      spellMeasureContext.font = `${style.fontStyle} ${style.fontVariant} ${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
      return spellMeasureContext.measureText(text).width;
    }

    function getRowAvailableWidth(row) {
      const style = window.getComputedStyle(row);
      const padding = parseFloat(style.paddingLeft || 0) + parseFloat(style.paddingRight || 0);
      return Math.max(1, row.getBoundingClientRect().width - padding - 2);
    }

    function takeOneLineChunk(text, row) {
      const normalized = String(text || "").replace(/\s+/g, " ").trim();
      if (!normalized) return { chunk: "", rest: "" };
      const maxWidth = getRowAvailableWidth(row);
      if (getRowTextWidth(row, normalized) <= maxWidth) return { chunk: normalized, rest: "" };

      let low = 1;
      let high = normalized.length;
      let best = 1;
      while (low <= high) {
        const mid = Math.floor((low + high) / 2);
        const sample = normalized.slice(0, mid);
        if (getRowTextWidth(row, sample) <= maxWidth) {
          best = mid;
          low = mid + 1;
        } else {
          high = mid - 1;
        }
      }

      const chunk = normalized.slice(0, best);
      const rest = normalized.slice(best).trimStart();
      return { chunk, rest };
    }

    function clearRows(rows) {
      rows.forEach((row) => {
        row.textContent = "";
        row.classList.remove("has-value");
      });
    }

    function fillSpellRowsWithOverflow(rows, spells) {
      clearRows(rows);
      let rowIndex = 0;
      (Array.isArray(spells) ? spells : []).forEach((spell) => {
        let remaining = formatSpell(spell);
        while (remaining && rowIndex < rows.length) {
          const row = rows[rowIndex];
          const result = takeOneLineChunk(remaining, row);
          if (!result.chunk) break;
          row.textContent = result.chunk;
          row.classList.add("has-value");
          remaining = result.rest;
          rowIndex += 1;
        }
      });
    }

    function renderSpellList(data) {
      const cantrips = pick(data, ["spellcasting.cantrips_known", "cantrips_known"], []);
      const cantripRows = Array.from(document.querySelectorAll("[data-cantrip-index]"))
        .sort((a, b) => Number(a.dataset.cantripIndex) - Number(b.dataset.cantripIndex));
      fillSpellRowsWithOverflow(cantripRows, cantrips);

      const prepared = pick(data, ["spellcasting.prepared", "prepared"], []);
      const byLevel = new Map();
      if (Array.isArray(prepared)) {
        prepared.forEach((spell) => {
          const level = String(spell && spell.level);
          if (!byLevel.has(level)) byLevel.set(level, []);
          byLevel.get(level).push(spell);
        });
      }

      for (let level = 1; level <= 9; level += 1) {
        const rows = Array.from(document.querySelectorAll(`[data-spell-level="${level}"]`))
          .sort((a, b) => Number(a.dataset.spellIndex) - Number(b.dataset.spellIndex));
        fillSpellRowsWithOverflow(rows, byLevel.get(String(level)) || []);
      }
    }

    function getAbilityData(data, key) {
      return pick(data, [`abilities.${key}`, `exports.embedded_json.abilities.${key}`], null);
    }

    function getSaveValue(ability) {
      if (!ability) return "";
      if (ability.save && typeof ability.save === "object") return formatBonus(ability.save.bonus);
      return formatBonus(ability.save);
    }

    function isSaveProficient(ability) {
      if (!ability) return false;
      if (ability.save && typeof ability.save === "object") return Boolean(ability.save.proficient);
      return ability.save_prof === "O" || ability.save_prof === true;
    }

    function renderSaves(data) {
      abilityKeys.forEach((key) => {
        const ability = getAbilityData(data, key);
        const valueSlot = document.querySelector(`[data-save-score="${key}"]`);
        const dot = document.querySelector(`[data-save-prof="${key}"]`);
        if (valueSlot) {
          const value = getSaveValue(ability);
          valueSlot.textContent = value;
          valueSlot.classList.toggle("has-value", value !== "");
        }
        if (dot) dot.classList.toggle("filled-dot", isSaveProficient(ability));
      });
    }

    function formatEquipment(data) {
      const containers = pick(data, ["inventory.containers"], []);
      const looseItems = pick(data, ["inventory.items"], []);
      const items = [];

      if (Array.isArray(containers)) {
        containers.forEach((container) => {
          if (container && Array.isArray(container.items)) items.push(...container.items);
        });
      }
      if (Array.isArray(looseItems)) items.push(...looseItems);

      return items
        .filter((item) => item && item.name)
        .map((item) => {
          const weight = item.weight !== undefined && item.weight !== null && item.weight !== "" ? `${item.weight}lb` : "?lb";
          const description = item.description !== undefined && item.description !== null ? String(item.description) : "";
          const shouldExpandDescription = ["套装", "套组", "工具"].some((keyword) => String(item.name).includes(keyword));
          if (shouldExpandDescription && description && description !== "-") return `${item.name}(${weight}):${description}`;
          return `${item.name}(${weight})`;
        })
        .join("\n");
    }

    function renderSkills(data) {
      const skills = pick(data, ["skills"], []);
      const byName = new Map(Array.isArray(skills) ? skills.map((skill) => [skill.name, skill]) : []);

      skillNames.forEach((name) => {
        const skill = byName.get(name);
        const totalSlot = document.querySelector(`[data-skill-total="${name}"]`);
        const dot = document.querySelector(`[data-skill-prof="${name}"]`);
        if (totalSlot) {
          const total = skill ? formatBonus(skill.total) : "";
          totalSlot.textContent = total;
          totalSlot.classList.toggle("has-value", total !== "");
        }
        if (dot) {
          const proficiency = skill ? skill.proficiency : "none";
          const filled = proficiency === "proficient" || proficiency === "expertise";
          dot.classList.toggle("filled-dot", filled);
        }
      });
    }

    function renderWeapons(data) {
      const weapons = pick(data, ["combat.weapons", "exports.embedded_json.combat.weapons"], []);
      document.querySelectorAll("[data-weapon]").forEach((slot) => {
        const index = Number(slot.getAttribute("data-weapon"));
        const field = slot.getAttribute("data-weapon-field");
        const weapon = Array.isArray(weapons) ? weapons[index] : null;
        let value = "";
        if (weapon) {
          if (field === "name") value = weapon.name || "";
          if (field === "attack") value = weapon.attack_bonus || weapon.atk || "";
          if (field === "damage") value = formatWeaponDamage(weapon);
        }
        slot.textContent = value;
        slot.classList.toggle("has-value", value !== "");
      });
    }

    function renderCharacter(data) {
      clearFilledData();

      setSlot("[data-fill='characterName']", pick(data, ["identity.display_name", "display_name", "exports.embedded_json.identity.display_name", "exports.embedded_json.identity.character_name"]));
      setSlot("[data-fill='classes']", formatClasses(data));
      setSlot("[data-fill='background']", pick(data, ["background.background_name", "background_name"]));
      setSlot("[data-fill='player']", pick(data, ["identity.player", "player", "exports.embedded_json.identity.player"]));
      setSlot("[data-fill='race']", formatRace(data));
      setSlot("[data-fill='alignment']", pick(data, ["identity.alignment", "alignment", "exports.embedded_json.identity.alignment"]));

      abilityKeys.forEach((key) => {
        setSlot(`[data-fill='ability.${key}']`, pick(data, [`abilities.${key}.total`, `abilities.${key}.score`, `exports.embedded_json.abilities.${key}.score`]));
      });

      setSlot("[data-fill='profBonus']", formatBonus(pick(data, ["core_stats.proficiency_bonus", "prof_bonus", "exports.embedded_json.core_stats.prof_bonus"])));
      setSlot("[data-fill='passivePerception']", pick(data, ["core_stats.passive_perception", "passive_perception", "exports.embedded_json.core_stats.passive_perception"]));
      setSlot("[data-fill='ac']", pick(data, ["core_stats.ac", "ac", "exports.embedded_json.core_stats.ac"]));
      setSlot("[data-fill='initiative']", formatBonus(pick(data, ["core_stats.initiative", "initiative", "exports.embedded_json.core_stats.initiative"])));
      setSlot("[data-fill='speed']", pick(data, ["core_stats.speed", "speed", "exports.embedded_json.core_stats.speed"]));
      setSlot("[data-fill='hpMax']", pick(data, ["core_stats.hp.max", "hp.max", "exports.embedded_json.core_stats.hp.max"]));
      setSlot("[data-fill='hitDiceMax']", pick(data, ["core_stats.hit_dice.max", "hd.max", "exports.embedded_json.core_stats.hd.max"]));
      setSlot("[data-fill='otherProficiencies']", formatOtherProficiencies(data));
      setSlot("[data-fill='gp']", pick(data, ["inventory.currency.total_gp_raw", "exports.embedded_json.currency.gp"]));
      setSlot("[data-fill='equipment']", formatEquipment(data));
      setSlot("[data-fill='personality']", formatPersonality(data));
      setSlot("[data-fill='ideals']", pick(data, ["background.ideals", "ideals"]));
      setSlot("[data-fill='bonds']", pick(data, ["background.bonds", "bonds"]));
      setSlot("[data-fill='flaws']", pick(data, ["background.flaws", "flaws"]));
      setSlot("[data-fill='features']", formatFeatures(data));

      setSlot("[data-fill='spellClass']", formatSpellClass(data));
      setSlot("[data-fill='spellAbility']", pick(data, ["spellcasting.spellcasting_ability", "spellcasting_ability"]));
      setSlot("[data-fill='spellSaveDC']", pick(data, ["spellcasting.save_dc", "save_dc"]));
      setSlot("[data-fill='spellAttackBonus']", pick(data, ["spellcasting.attack_bonus", "attack_bonus"]));

      renderSaves(data);
      renderSkills(data);
      renderWeapons(data);
      renderSpellSlots(data);
      renderSpellList(data);
    }
  </script>
</body>
</html>
